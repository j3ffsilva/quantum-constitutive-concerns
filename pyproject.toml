[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-constitutive-concerns"
version = "1.0.0"
description = "Executable examples for constitutive concerns in quantum software"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Jefferson de Oliveira Silva", email = "jefferson.oliveira@prof.inteli.edu.br"},
  {name = "Bryan Kano Ferreira", email = "bryan.ferreira@prof.inteli.edu.br"},
  {name = "Murilo Zanini de Carvalho", email = "murilo.zanini@prof.inteli.edu.br"},
  {name = "Fabiana Naomi Iegawa", email = "fabiana.iegawa@prof.inteli.edu.br"},
]
dependencies = [
  "qiskit==2.4.2",
  "qiskit-aer==0.17.2",
  "qiskit-ibm-runtime==0.47.0",
  "mitiq==1.0.0",
  # Required by Mitiq's Qiskit/Cirq QASM conversion path. It is explicit
  # because mitiq[qiskit] constrains qiskit-ibm-runtime to an older release.
  "ply==3.11",
]

[project.scripts]
quantum-constitutive-concerns = "quantum_constitutive_concerns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
