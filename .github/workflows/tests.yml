name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run fast tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Reproduce reference results
        env:
          RUN_FULL_REPRODUCTION: "1"
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p 'test_reference_results.py'
